  <!-- Start the archive requests now instead of after the app bundle has run.
       client/src/hooks/useEditions.js picks them up from window.__suEarly. -->
  <script>
    (function () {
      try {
        var get = function (url) {
          return fetch(url).then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          });
        };
        var index = { request: get('/spotify/editions') };
        var early = window.__suEarly = { index: index };
        index.request.then(function (data) {
          try { performance.mark('su:index-loaded', { detail: (data.items || []).length }); } catch (e) { /* diagnostics only */ }
        }, function () { /* the app reports the failure */ });
        var id = new URLSearchParams(location.search).get('edition');
        if (id && /^[0-9a-f]{24}$/i.test(id)) {
          early.edition = { id: id, request: get('/spotify/editions/' + id) };
          early.edition.request.catch(function () { /* the app reports the failure */ });
        }
      } catch (e) { /* the app fetches for itself */ }
    })();
  </script>
