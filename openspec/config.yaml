schema: spec-driven

# Background for every planning document OpenSpec writes.
context: |
  Archived weeks cannot be re-fetched: Spotify overwrites its playlists weekly
  and the upstream backfill source stopped around December 2025. Treat
  production MongoDB data as irreplaceable.
  One-time scripts stay standalone, not in package.json or the Vitest config.
  UI depth comes from vignettes and glows, never noise or film-grain textures.

# Extra instructions for writing one specific planning document.
rules:
  proposal:
    - If the change writes to production data, explain how and how to roll back
  design:
    - If the page loads anything from a new external domain, name the CSP directive to update
